name = "cis-benchmarks-mcp"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# Deploy to all regions for lowest latency
# Remove or set to a specific region if needed
# workers_dev = true

[vars]
# The DO App Platform URL — update after first deploy
DO_ORIGIN_URL = "https://cis-benchmarks-mcp.ondigitalocean.app"
# CORS allowed origin — restrict to your Claude Code client domain if needed
ALLOWED_ORIGIN = "*"

# Secrets — set via CLI, never commit values:
#   wrangler secret put MCP_API_KEY
#
# Then configure your MCP client to send:
#   Authorization: Bearer <MCP_API_KEY>
#
# To deploy:
#   wrangler deploy
#
# To test locally:
#   wrangler dev --remote
